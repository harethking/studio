<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إدارة الاستوديو</title>
<style>
:root{--bg:#f7f5f2;--card:#fff;--ink:#1f1f1f;--muted:#777;--gold:#b8912f;--line:#e6e2dc;--danger:#b13c3c;--ok:#2f7d4f}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
header{background:var(--ink);color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
header h1{font-size:18px;margin:0;color:var(--gold)}
nav{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
nav button{background:none;border:none;color:#ddd;padding:8px 12px;cursor:pointer;font:inherit;border-bottom:2px solid transparent}
nav button.on{color:#fff;border-bottom-color:var(--gold)}
nav button.logout{color:#bbb;font-size:13px}
main{max-width:960px;margin:20px auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
h2{font-size:17px;margin:0 0 12px}
input,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:7px;font:inherit;background:#fff}
label{display:block;font-size:13px;color:var(--muted);margin:8px 0 4px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.actions input{flex:1;min-width:200px}
button.btn{background:var(--gold);color:#fff;border:none;border-radius:7px;padding:9px 16px;cursor:pointer;font:inherit}
button.btn:disabled{opacity:.5;cursor:wait}
button.btn:hover{opacity:.9}
button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
button.danger{background:var(--danger);color:#fff}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.item:last-child{border-bottom:none}
.muted{color:var(--muted);font-size:13px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:20px;background:#eee}
.tag.pub,.tag.done{background:#e3f1e8;color:var(--ok)}
.tag.priv{background:#f3e8c8;color:#7a5b10}
.tag.cancel{background:#f6dede;color:var(--danger)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:12px}
.photos .ph{position:relative}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;display:block}
.photos .del{position:absolute;top:4px;left:4px;padding:2px 8px}
.hidden{display:none!important}
.msg{padding:10px;border-radius:7px;margin-top:10px;font-size:14px}
.msg.err{background:#f6dede;color:var(--danger)}
.msg.info{background:#f3efe6;color:#5a4a1e}
.narrow{max-width:420px;margin:30px auto}
.viewer{max-width:720px;margin:30px auto;text-align:center}
.viewer input{max-width:220px;margin:auto;text-align:center}
@media(max-width:600px){header{justify-content:center}}
</style>
</head>
<body>
<header>
  <h1>إدارة الاستوديو</h1>
  <nav>
    <button data-tab="bookings" class="on">الحجوزات</button>
    <button data-tab="albums">الألبومات</button>
    <button id="logout" class="logout hidden">خروج</button>
  </nav>
</header>
<main id="main"><div class="card"><p class="muted">جاري التحميل...</p></div></main>

<!-- Appwrite Web SDK -->
<script src="https://cdn.jsdelivr.net/npm/appwrite@28.3.0"></script>

<script>
/* ============ 1) إعدادات Appwrite ============
   انسخ Project ID من الكونسول. وإذا مشروعك في منطقة ثانية غيّر الـ endpoint. */
const APPWRITE_ENDPOINT = 'https://cloud.appwrite.io/v1';
const APPWRITE_PROJECT_ID = '6ad4fc020017bf12e369';
const DB_ID = 'studio';
const TBL_BOOKINGS = 'bookings';
const TBL_ALBUMS = 'albums';
const BUCKET_ID = 'photos';

if (APPWRITE_PROJECT_ID.startsWith('YOUR_')) {
  document.getElementById('main').innerHTML =
    '<div class="card"><h2>ناقص الإعداد</h2><p>ضع Project ID داخل APPWRITE_PROJECT_ID، ثم حدّث الصفحة.</p></div>';
  throw new Error('Appwrite project id not set');
}

const client = new Appwrite.Client().setEndpoint(APPWRITE_ENDPOINT).setProject(APPWRITE_PROJECT_ID);
const account = new Appwrite.Account(client);
const tablesDB = new Appwrite.TablesDB(client);
const storage = new Appwrite.Storage(client);
const {ID, Query} = Appwrite;

/* ============ 2) الحالة ============ */
let me = null;          // المصور المسجّل، أو null للزبون
let bookings = [];
let albums = [];
let ready = false;
let tab = 'bookings';
let openAlbum = null;
let unlockedId = null;
let busyMsg = '';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STATUS = {pending: 'بانتظار', done: 'منجز', cancel: 'ملغى'};

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function shareLink(a) {
  return location.href.split('#')[0] + '#view=' + a.id;
}

function copyLink(a) {
  const link = shareLink(a);
  const done = () => alert('تم نسخ الرابط' + (a.type === 'private' ? '\nالرمز: ' + a.code + '\nأرسل الرمز للزبون بشكل منفصل.' : ''));
  if (navigator.clipboard) {
    navigator.clipboard.writeText(link).then(done, () => prompt('انسخ الرابط:', link));
  } else {
    prompt('انسخ الرابط:', link);
  }
}

/* رابط الصورة: إما رابط خارجي أو معرّف ملف في Storage */
function photoUrl(p) {
  if (/^https?:\/\//.test(p)) return p;
  return storage.getFileView({bucketId: BUCKET_ID, fileId: p}).toString();
}

/* ============ 3) تحميل البيانات ============ */
async function refresh() {
  try {
    const aRes = await tablesDB.listRows({databaseId: DB_ID, tableId: TBL_ALBUMS, queries: [Query.limit(500)]});
    albums = aRes.rows.map(r => ({...r, id: r.$id, photos: r.photos || []}))
      .sort((a, b) => String(b.created).localeCompare(String(a.created)));
    if (me) {
      const bRes = await tablesDB.listRows({databaseId: DB_ID, tableId: TBL_BOOKINGS, queries: [Query.limit(500)]});
      bookings = bRes.rows.map(r => ({...r, id: r.$id}));
    }
  } catch (err) {
    alert('خطأ بالاتصال بـ Appwrite: ' + err.message);
  }
  ready = true;
  render();
}

async function checkLogin() {
  try { me = await account.get(); } catch (e) { me = null; }
}

/* ============ 4) تصغير الصورة ورفعها ============ */
function fileToBlob(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s);
      c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? resolve(b) : reject(new Error('blob')), 'image/jpeg', 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('bad image')); };
    img.src = url;
  });
}

async function uploadPhoto(albumId, file) {
  const blob = await fileToBlob(file);
  const f = new File([blob], Date.now() + '.jpg', {type: 'image/jpeg'});
  const created = await storage.createFile({bucketId: BUCKET_ID, fileId: ID.unique(), file: f});
  const row = await tablesDB.getRow({databaseId: DB_ID, tableId: TBL_ALBUMS, rowId: albumId});
  await tablesDB.updateRow({databaseId: DB_ID, tableId: TBL_ALBUMS, rowId: albumId,
    data: {photos: [...(row.photos || []), created.$id]}});
}

/* ============ 5) تسجيل الدخول ============ */
function renderLogin() {
  $('#main').innerHTML = `
  <div class="card narrow">
    <h2>دخول المصور</h2>
    <form id="loginF">
      <label>البريد الإلكتروني</label><input name="email" type="email" required>
      <label>كلمة المرور</label><input name="pw" type="password" required>
      <div style="margin-top:12px"><button class="btn">دخول</button></div>
    </form>
  </div>`;
  $('#loginF').onsubmit = async e => {
    e.preventDefault();
    const f = new FormData(e.target);
    try {
      await account.createEmailPasswordSession({email: f.get('email'), password: f.get('pw')});
      await checkLogin();
      await refresh();
    } catch (err) {
      alert('فشل الدخول: ' + err.message);
    }
  };
}

/* ============ 6) الحجوزات ============ */
function bookingRow(b) {
  const statusClass = b.status === 'done' ? 'done' : b.status === 'cancel' ? 'cancel' : '';
  const phone = b.phone ? ' · <a href="tel:' + esc(b.phone) + '">' + esc(b.phone) + '</a>' : '';
  const price = b.price ? ' · ' + Number(b.price).toLocaleString('en') + ' د.ع' : '';
  return `<div class="item">
    <div>
      <strong>${esc(b.name)}</strong>
      <span class="tag">${esc(b.service)}</span>
      <span class="tag ${statusClass}">${STATUS[b.status] || ''}</span>
      <div class="muted">${esc(b.date)} · ${esc(b.time)}${phone}${price}</div>
    </div>
    <div class="actions">
      ${b.status === 'pending' ? `<button class="btn ghost" data-act="done" data-id="${b.id}">منجز</button>
      <button class="btn ghost" data-act="cancel" data-id="${b.id}">إلغاء</button>` : ''}
      <button class="btn danger" data-act="delb" data-id="${b.id}">حذف</button>
    </div>
  </div>`;
}

function renderBookings() {
  const list = [...bookings].sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  $('#main').innerHTML = `
  <div class="card">
    <h2>حجز جديد</h2>
    <form id="bForm">
      <div class="row">
        <div><label>اسم الزبون</label><input name="name" required></div>
        <div><label>رقم الهاتف</label><input name="phone" type="tel"></div>
        <div><label>الخدمة</label>
          <select name="service">
            <option>تصوير شخصي</option>
            <option>تصوير عائلي</option>
            <option>تصوير زفاف</option>
            <option>تصوير منتج</option>
            <option>جلسة حمل / مولود</option>
            <option>أخرى</option>
          </select></div>
        <div><label>التاريخ</label><input name="date" type="date" value="${todayStr()}" required></div>
        <div><label>الوقت</label><input name="time" type="time" value="10:00" required></div>
        <div><label>السعر (د.ع)</label><input name="price" type="number" min="0" value="0"></div>
      </div>
      <div style="margin-top:12px"><button class="btn">حفظ الحجز</button></div>
    </form>
  </div>
  <div class="card">
    <h2>المواعيد (${list.length})</h2>
    ${list.length ? list.map(bookingRow).join('') : '<p class="muted">لا توجد حجوزات بعد.</p>'}
  </div>`;

  $('#bForm').onsubmit = async e => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target));
    try {
      await tablesDB.createRow({databaseId: DB_ID, tableId: TBL_BOOKINGS, rowId: ID.unique(), data: {
        name: f.name.trim(),
        phone: (f.phone || '').trim(),
        service: f.service,
        date: f.date,
        time: f.time,
        price: Number(f.price) || 0,
        status: 'pending'
      }});
      e.target.reset();
      await refresh();
    } catch (err) { alert('خطأ: ' + err.message); }
  };
}

/* ============ 7) الألبومات ============ */
function albumRow(a) {
  return `<div class="item">
    <div>
      <strong>${esc(a.title)}</strong>
      <span class="tag ${a.type === 'public' ? 'pub' : 'priv'}">${a.type === 'public' ? 'عام' : 'خاص 🔒'}</span>
      <div class="muted">${esc(a.client || 'بدون اسم زبون')} · ${a.photos.length} صورة · ${esc(a.created)}</div>
    </div>
    <div class="actions">
      <button class="btn ghost" data-act="open" data-id="${a.id}">إدارة</button>
      <button class="btn ghost" data-act="copy" data-id="${a.id}">نسخ الرابط</button>
      <button class="btn danger" data-act="dela" data-id="${a.id}">حذف</button>
    </div>
  </div>`;
}

function renderAlbums() {
  $('#main').innerHTML = `
  <div class="card">
    <h2>ألبوم جديد</h2>
    <form id="aForm">
      <div class="row">
        <div><label>عنوان الألبوم</label><input name="title" required></div>
        <div><label>اسم الزبون</label><input name="client"></div>
        <div><label>النوع</label>
          <select name="type" id="aType">
            <option value="public">عام (ينشر للجميع)</option>
            <option value="private">خاص (برمز)</option>
          </select></div>
        <div id="codeWrap" class="hidden"><label>رمز الدخول (4 أرقام أو أكثر)</label>
          <input name="code" inputmode="numeric"></div>
      </div>
      <div style="margin-top:12px"><button class="btn">إنشاء الألبوم</button></div>
    </form>
  </div>
  <div class="card">
    <h2>الألبومات (${albums.length})</h2>
    ${albums.length ? albums.map(albumRow).join('') : '<p class="muted">لا توجد ألبومات بعد.</p>'}
  </div>`;

  $('#aType').onchange = e => $('#codeWrap').classList.toggle('hidden', e.target.value !== 'private');

  $('#aForm').onsubmit = async e => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target));
    if (f.type === 'private' && !/^\d{4,}$/.test((f.code || '').trim())) {
      alert('الرمز لازم يكون 4 أرقام أو أكثر');
      return;
    }
    try {
      await tablesDB.createRow({databaseId: DB_ID, tableId: TBL_ALBUMS, rowId: ID.unique(), data: {
        title: f.title.trim(),
        client: (f.client || '').trim(),
        type: f.type,
        code: f.type === 'private' ? f.code.trim() : '',
        photos: [],
        created: todayStr()
      }});
      e.target.reset();
      await refresh();
    } catch (err) { alert('خطأ: ' + err.message); }
  };
}

function renderManage(id) {
  const a = albums.find(x => x.id === id);
  if (!a) { openAlbum = null; return renderAlbums(); }

  $('#main').innerHTML = `
  <div class="card">
    <div class="actions" style="justify-content:space-between">
      <button class="btn ghost" data-act="back">← رجوع</button>
      <span class="tag ${a.type === 'public' ? 'pub' : 'priv'}">${a.type === 'public' ? 'عام' : 'خاص 🔒'}</span>
    </div>
    <h2 style="margin-top:12px">${esc(a.title)}</h2>
    <div class="muted">${esc(a.client || 'بدون اسم زبون')}</div>
    ${a.type === 'private' ? `<p>رمز الدخول: <strong>${esc(a.code)}</strong></p>` : ''}
    <label>رابط المشاركة</label>
    <div class="actions">
      <input value="${esc(shareLink(a))}" readonly onclick="this.select()">
      <button class="btn" data-act="copy" data-id="${a.id}">نسخ</button>
    </div>
  </div>
  <div class="card">
    <h2>الصور (${a.photos.length})</h2>
    <label>رفع صور من جهازك</label>
    <input type="file" id="upl" accept="image/*" multiple>
    <label>أو أضف رابط صورة</label>
    <div class="actions">
      <input id="urlIn" placeholder="https://...">
      <button class="btn ghost" id="addUrl">إضافة</button>
    </div>
    ${busyMsg ? `<div class="msg info">${esc(busyMsg)}</div>` : ''}
    <div class="photos">
      ${a.photos.length ? a.photos.map((p, i) => `<div class="ph">
        <img src="${esc(photoUrl(p))}" alt="">
        <button class="btn danger del" data-act="delp" data-idx="${i}">×</button>
      </div>`).join('') : '<p class="muted">لا توجد صور بعد.</p>'}
    </div>
  </div>`;

  $('#upl').onchange = async e => {
    const files = [...e.target.files];
    for (let i = 0; i < files.length; i++) {
      busyMsg = `جاري الرفع ${i + 1} من ${files.length}...`;
      renderManage(id);
      try { await uploadPhoto(id, files[i]); }
      catch (err) { alert('فشل رفع: ' + files[i].name + '\n' + err.message); }
    }
    busyMsg = '';
    await refresh();
  };

  $('#addUrl').onclick = async () => {
    const u = $('#urlIn').value.trim();
    if (!/^https?:\/\//.test(u)) { alert('أدخل رابط يبدأ بـ https://'); return; }
    const row = await tablesDB.getRow({databaseId: DB_ID, tableId: TBL_ALBUMS, rowId: id});
    await tablesDB.updateRow({databaseId: DB_ID, tableId: TBL_ALBUMS, rowId: id,
      data: {photos: [...(row.photos || []), u]}});
    $('#urlIn').value = '';
    await refresh();
  };
}

/* ============ 8) صفحة الزبون ============ */
function renderViewer(id) {
  if (!ready) {
    $('#main').innerHTML = '<div class="viewer card"><p class="muted">جاري التحميل...</p></div>';
    return;
  }
  const a = albums.find(x => x.id === id);
  let html;
  if (!a) {
    html = '<div class="viewer card"><p>الألبوم غير موجود أو تم حذفه.</p></div>';
  } else if (a.type === 'private' && unlockedId !== a.id) {
    html = `<div class="viewer card">
      <h2>🔒 ${esc(a.title)}</h2>
      <p class="muted">هذا الألبوم خاص. أدخل الرمز الذي أرسله لك المصور.</p>
      <form id="unlock">
        <input id="codeIn" inputmode="numeric" placeholder="الرمز">
        <div style="margin-top:12px"><button class="btn">فتح</button></div>
      </form>
      <div id="unlockMsg"></div>
    </div>`;
  } else {
    html = `<div class="card">
      <h2>${esc(a.title)}</h2>
      <div class="muted">${esc(a.client)}</div>
      <div class="photos">
        ${a.photos.length ? a.photos.map(p => `<img src="${esc(photoUrl(p))}" alt="">`).join('') : '<p class="muted">لا توجد صور بعد.</p>'}
      </div>
    </div>`;
  }
  $('#main').innerHTML = html;

  const form = $('#unlock');
  if (form) {
    form.onsubmit = e => {
      e.preventDefault();
      if ($('#codeIn').value.trim() === a.code) {
        unlockedId = a.id;
        renderViewer(id);
      } else {
        $('#unlockMsg').innerHTML = '<div class="msg err">الرمز غير صحيح</div>';
      }
    };
  }
}

/* ============ 9) التوجيه والأحداث ============ */
function render() {
  document.querySelectorAll('nav button[data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  $('#logout').classList.toggle('hidden', !me);
  if (location.hash.startsWith('#view=')) return renderViewer(decodeURIComponent(location.hash.slice(6)));
  if (!ready) { $('#main').innerHTML = '<div class="card"><p class="muted">جاري التحميل...</p></div>'; return; }
  if (!me) return renderLogin();
  if (tab === 'bookings') return renderBookings();
  if (openAlbum) return renderManage(openAlbum);
  renderAlbums();
}

document.querySelector('nav').addEventListener('click', async e => {
  if (e.target.id === 'logout') {
    try { await account.deleteSession({sessionId: 'current'}); } catch (err) { /* الجلسة منتهية */ }
    me = null; bookings = []; openAlbum = null;
    render();
    return;
  }
  const b = e.target.closest('button[data-tab]');
  if (!b) return;
  tab = b.dataset.tab;
  openAlbum = null;
  if (location.hash) history.replaceState(null, '', location.pathname + location.search);
  render();
});

$('#main').addEventListener('click', async e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  const id = el.dataset.id;

  try {
    if (act === 'done' || act === 'cancel') {
      await tablesDB.updateRow({databaseId: DB_ID, tableId: TBL_BOOKINGS, rowId: id, data: {status: act}});
      await refresh();
    } else if (act === 'delb') {
      if (!confirm('حذف هذا الحجز؟')) return;
      await tablesDB.deleteRow({databaseId: DB_ID, tableId: TBL_BOOKINGS, rowId: id});
      await refresh();
    } else if (act === 'open') {
      openAlbum = id;
      render();
    } else if (act === 'back') {
      openAlbum = null;
      render();
    } else if (act === 'dela') {
      if (!confirm('حذف الألبوم وكل صوره؟')) return;
      const a = albums.find(x => x.id === id);
      if (a) {
        for (const p of a.photos) {
          if (/^https?:\/\//.test(p)) continue;
          try { await storage.deleteFile({bucketId: BUCKET_ID, fileId: p}); } catch (err) { /* تجاهل */ }
        }
      }
      await tablesDB.deleteRow({databaseId: DB_ID, tableId: TBL_ALBUMS, rowId: id});
      if (openAlbum === id) openAlbum = null;
      await refresh();
    } else if (act === 'delp') {
      if (!confirm('حذف هذه الصورة؟')) return;
      const a = albums.find(x => x.id === openAlbum);
      if (a) {
        const p = a.photos[Number(el.dataset.idx)];
        const row = await tablesDB.getRow({databaseId: DB_ID, tableId: TBL_ALBUMS, rowId: a.id});
        await tablesDB.updateRow({databaseId: DB_ID, tableId: TBL_ALBUMS, rowId: a.id,
          data: {photos: (row.photos || []).filter(x => x !== p)}});
        if (!/^https?:\/\//.test(p)) {
          try { await storage.deleteFile({bucketId: BUCKET_ID, fileId: p}); } catch (err) { /* تجاهل */ }
        }
        await refresh();
      }
    } else if (act === 'copy') {
      const a = albums.find(x => x.id === id);
      if (a) copyLink(a);
    }
  } catch (err) {
    alert('خطأ: ' + err.message);
  }
});

window.addEventListener('hashchange', render);

(async () => {
  await checkLogin();
  await refresh();
})();
</script>
</body>
</html>
